paths:
  /factures:
    post:
      summary: Creer une facture
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Facture'
      responses:
        "201":
          description: Facture creee
  /factures/{id}:
    get:
      summary: Recuperer une facture
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      summary: Supprimer une facture
  /health:
    get:
      summary: Verifier que l'API tourne

components:
  schemas:
    Facture:
      type: object
      required:
        - montant
        - description
      properties:
        montant:
          type: number
          minimum: 10
          maximum: 500
        description:
          type: string
          minLength: 3
        devise:
          type: string
          enum: ["EUR", "USD", "MAD"]
        dateEmission:
          type: string
          format: date