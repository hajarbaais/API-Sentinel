[project]
name = "api-sentinel"
version = "0.1.0"
description = "Framework de test de securite pour API (BOLA/IDOR, AppSec, Cloud)"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pyyaml",
    "flask",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
api-sentinel = "api_sentinel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]